name: Release to Maven Central

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (if empty, derive from project version)'
        required: false
  # Automatic trigger on pushing a version tag (e.g., "v1.2.3")
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install necessary tooling
        env:
          APACHE_THRIFT_VERSION: 0.9.3
        run: |
          apt-get update && apt-get install -y wget gcc make build-essential git

          wget https://archive.apache.org/dist/thrift/${APACHE_THRIFT_VERSION}/thrift-${APACHE_THRIFT_VERSION}.tar.gz && \
          tar -xvf thrift-${APACHE_THRIFT_VERSION}.tar.gz && \
          rm thrift-${APACHE_THRIFT_VERSION}.tar.gz && \
          cd thrift-${APACHE_THRIFT_VERSION}/ && \
          ./configure --enable-libs=no --enable-tests=no --enable-tutorial=no --with-cpp=no --with-c_glib=no --with-java=yes --with-ruby=no --with-erlang=no --with-go=no --with-nodejs=no --with-python=no && \
          make && \
          make install && \
          cd .. && \
          rm -rf thrift-${APACHE_THRIFT_VERSION}

      - name: Determine release version
        id: vars
        run: |
          ./gradlew -q printVersion

      # Sign via the runner's gpg (useGpgCmd). Gradle 6.0 in-memory signing cannot
      # read Ed25519 keys and only accepts 8-character short key IDs.
      - name: Import GPG signing key
        env:
          SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          # Accept both real multi-line armor and single-line literal \n form.
          printf '%b\n' "$SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publish to Sonatype OSSRH (Maven Central)
        env:
          SIGNING_KEY_ID: ${{ secrets.PGP_PRIVATE_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.PGP_SIGNING_KEY_PASSWORD }}
          OSSATUBER_PASSWORD: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_PASSWORD }}
          OSSATUBER_USERNAME: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_USERNAME }}
        run: |
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository --info \
            -Psigning.gnupg.executable=gpg \
            -Psigning.gnupg.keyName="${SIGNING_KEY_ID}" \
            -Psigning.gnupg.passphrase="${SIGNING_PASSWORD}" \
            -PossrhPassword="${OSSATUBER_PASSWORD}" \
            -PossrhUsername="${OSSATUBER_USERNAME}"
